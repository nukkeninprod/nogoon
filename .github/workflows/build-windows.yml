name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-release-0.2.0]
    paths:
      - 'wizard/**'
      - 'scripts/**'
      - 'tests/windows-*'
      - 'api/windows.js'
      - 'lib/windows-funnel.js'
      - 'package*.json'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wizard/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Test Windows counters and offline delivery
        run: node --test tests/windows-api.test.js tests/windows-telemetry.test.js tests/windows-checkout.test.js
      - name: Test Windows installation and restoration
        shell: powershell
        env:
          NOGOON_NO_TRACK: '1'
          NOGOON_SKIP_BROWSER_CLOSE: '1'
        run: ./tests/windows-system.ps1
      - name: Install desktop dependencies
        working-directory: wizard
        run: npm ci
      - name: Build unsigned Windows installer
        working-directory: wizard
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Test the packaged desktop installer
        run: node tests/windows-desktop.mjs
      - name: Installer checksum
        shell: powershell
        run: |
          $file = Get-Item wizard/dist/Nogoon-Setup-0.2.0.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content wizard/dist/SHA256SUMS.txt -Encoding ASCII
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: nogoon-windows-installer
          path: |
            wizard/dist/Nogoon-Setup-0.2.0.exe
            wizard/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence
          path: test-results/
          if-no-files-found: ignore
